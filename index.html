<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: #101827;
      color: #f4ead7;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scanner {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      margin-bottom: 8px;
    }

    p {
      color: #cfc5b5;
      font-size: 14px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      margin-top: 25px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f7f0e3;
      color: #172033;
    }

  </style>

</head>

<body>

  <div class="scanner">

    <h1>
      Abubakar &amp; Khadija
    </h1>

    <p>
      Point the camera at the guest's
      admission QR code.
    </p>

    <div id="reader"></div>

    <div
      class="status"
      id="status"
    >
      Starting camera...
    </div>

  </div>

  <script>

  const APPS_SCRIPT_URL =
    "YOUR-APPS-SCRIPT-EXEC-URL-HERE";

  const status =
    document.getElementById("status");

  const scanner =
    new Html5Qrcode("reader");


  scanner.start(
    {
      facingMode: "environment"
    },
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      status.textContent =
        "QR detected: " +
        decodedText;

      scanner.stop()
        .then(function() {

          const checkinUrl =
            APPS_SCRIPT_URL +
            "?page=checkin&passId=" +
            encodeURIComponent(
              decodedText
            );

          window.location.href =
            checkinUrl;

        });

    },

    function(errorMessage) {

      // Normal scanning errors are ignored.

    }

  ).catch(function(error) {

    console.error(
      "Camera error:",
      error
    );

    status.textContent =
      "Camera could not be opened. " +
      "Please allow camera access.";

  });

</script>
</body>
</html>
